name: Tests

on:
  push:
    branches: [ main, cursor/** ]
  pull_request:
    branches: [ main ]

jobs:
  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests
      timeout-minutes: 15
      env:
        REQUIRE_FFMPEG: "1"
      run: |
        pytest tests/ -v --tb=short --timeout=30 --durations=30 --junitxml=test-results/junit.xml

    # Report from the main run's JUnit XML (no second pytest run).
    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-junit
        path: test-results/junit.xml
        if-no-files-found: warn

  test-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      working-directory: web
      run: npm ci

    - name: Lint
      working-directory: web
      run: npm run lint

    - name: Unit tests (limits formatter, session token verifier)
      working-directory: web
      run: npm run test:unit

    - name: Build
      working-directory: web
      run: npm run build

  e2e:
    # ONE full dry-run episode through the studio UI against the REAL backend (no route mocks):
    # scripts/e2e_backend.py = Temporal dev server + production worker + FastAPI app in DRY_RUN.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Install web dependencies + Playwright Chromium
      working-directory: web
      run: |
        npm ci
        npx playwright install --with-deps chromium

    - name: Build Next.js (production build, the E2E runs `next start`)
      working-directory: web
      run: npm run build

    - name: Run the dry-run episode E2E
      working-directory: web
      timeout-minutes: 12
      env:
        CI: "true"
        E2E_PYTHON: python
        E2E_ADMIN_SECRET: ci-e2e-admin-secret-only-for-this-job-000
      run: npx playwright test -c playwright.e2e.config.ts

    - name: Upload Playwright trace + report on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-e2e-trace
        path: |
          web/test-results-e2e/
          web/playwright-report/
        if-no-files-found: warn
        retention-days: 7

  redgreen:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run red-green mutation tests
      env:
        REQUIRE_FFMPEG: "1"
      run: |
        find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
        rm -rf .pytest_cache 2>/dev/null || true
        bash scripts/redgreen.sh
