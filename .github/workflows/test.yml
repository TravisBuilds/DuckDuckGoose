name: Tests

on:
  push:
    branches: [ main, cursor/** ]
  pull_request:
    branches: [ main ]

jobs:
  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests
      timeout-minutes: 15
      env:
        REQUIRE_FFMPEG: "1"
      run: |
        pytest tests/ -v --tb=short --timeout=30 --durations=30 --junitxml=test-results/junit.xml

    # Report from the main run's JUnit XML (no second pytest run).
    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-junit
        path: test-results/junit.xml
        if-no-files-found: warn

  test-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      working-directory: web
      run: npm ci

    - name: Lint
      working-directory: web
      run: npm run lint

    - name: Unit tests (limits formatter)
      working-directory: web
      run: npm run test:unit

    - name: Build
      working-directory: web
      run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Install Playwright
      working-directory: web
      run: |
        npm ci
        npx playwright install --with-deps chromium

    - name: Start API server
      run: |
        export ADMIN_SECRET="test-secret-that-is-at-least-32-chars-long"
        export DRY_RUN="true"
        export DATABASE_PATH="./test-e2e.db"
        python -m api.main &
        echo $! > api.pid
        sleep 5

    - name: Build Next.js
      working-directory: web
      run: npm run build

    - name: Run E2E test
      working-directory: web
      timeout-minutes: 10
      env:
        CI: "true"
      run: npx playwright test full-episode-e2e.spec.ts --reporter=list

    - name: Upload Playwright trace on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-trace
        path: web/test-results/
        if-no-files-found: warn

    - name: Stop API server
      if: always()
      run: |
        if [ -f api.pid ]; then
          kill $(cat api.pid) || true
        fi

  redgreen:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run red-green mutation tests
      env:
        REQUIRE_FFMPEG: "1"
      run: |
        find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
        rm -rf .pytest_cache 2>/dev/null || true
        bash scripts/redgreen.sh
