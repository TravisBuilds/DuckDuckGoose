name: Tests

on:
  push:
    branches: [ main, cursor/** ]
  pull_request:
    branches: [ main ]

jobs:
  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests
      timeout-minutes: 15
      env:
        REQUIRE_FFMPEG: "1"
      run: |
        pytest tests/ -v --tb=short --timeout=30 --durations=30 --junitxml=test-results/junit.xml

    # Report from the main run's JUnit XML (no second pytest run).
    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-junit
        path: test-results/junit.xml
        if-no-files-found: warn

  test-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      working-directory: web
      run: npm ci

    - name: Lint
      working-directory: web
      run: npm run lint

    - name: Unit tests (limits formatter, session token verifier)
      working-directory: web
      run: npm run test:unit

    - name: Build
      working-directory: web
      run: npm run build

  e2e:
    # ONE full dry-run episode through the studio UI against the REAL backend (no route mocks):
    # scripts/e2e_backend.py = Temporal dev server + production worker + FastAPI app in DRY_RUN.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Install web dependencies + Playwright Chromium
      working-directory: web
      run: |
        npm ci
        npx playwright install --with-deps chromium

    - name: Build Next.js (production build, the E2E runs `next start`)
      working-directory: web
      run: npm run build

    - name: Run the dry-run episode E2E
      working-directory: web
      timeout-minutes: 12
      env:
        CI: "true"
        E2E_PYTHON: python
        E2E_ADMIN_SECRET: ci-e2e-admin-secret-only-for-this-job-000
      run: npx playwright test -c playwright.e2e.config.ts

    - name: Upload Playwright trace + report on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-e2e-trace
        path: |
          web/test-results-e2e/
          web/playwright-report/
        if-no-files-found: warn
        retention-days: 7

  redgreen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('setup.py') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run red-green mutation tests (shard ${{ matrix.shard }}/4)
      env:
        REQUIRE_FFMPEG: "1"
        REDGREEN_SHARD: ${{ matrix.shard }}
        REDGREEN_TOTAL_SHARDS: "4"
      run: |
        find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
        rm -rf .pytest_cache 2>/dev/null || true
        bash scripts/redgreen.sh
    
    - name: Upload shard results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: redgreen-shard-${{ matrix.shard }}
        path: /tmp/redgreen-shard-${{ matrix.shard }}-summary.txt
        if-no-files-found: warn

  redgreen-summary:
    runs-on: ubuntu-latest
    needs: redgreen
    if: always()
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all shard results
      uses: actions/download-artifact@v4
      with:
        path: redgreen-results
    
    - name: Generate summary
      run: |
        echo "# Red-Green Mutation Test Summary" > docs/REDGREEN-STATUS.md
        echo "" >> docs/REDGREEN-STATUS.md
        echo "Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> docs/REDGREEN-STATUS.md
        echo "Branch: ${{ github.ref_name }}" >> docs/REDGREEN-STATUS.md
        echo "Commit: ${{ github.sha }}" >> docs/REDGREEN-STATUS.md
        echo "" >> docs/REDGREEN-STATUS.md
        
        total_pass=0
        total_fail=0
        total_skip=0
        total_invalid=0
        
        for shard in 1 2 3 4; do
          if [ -f "redgreen-results/redgreen-shard-${shard}/redgreen-shard-${shard}-summary.txt" ]; then
            echo "## Shard ${shard}" >> docs/REDGREEN-STATUS.md
            cat "redgreen-results/redgreen-shard-${shard}/redgreen-shard-${shard}-summary.txt" >> docs/REDGREEN-STATUS.md
            echo "" >> docs/REDGREEN-STATUS.md
            
            # Extract counts (assuming format "X PASS, Y FAIL, Z SKIP, W INVALID")
            pass=$(grep -oP '\d+ PASS' "redgreen-results/redgreen-shard-${shard}/redgreen-shard-${shard}-summary.txt" | grep -oP '\d+' || echo "0")
            fail=$(grep -oP '\d+ FAIL' "redgreen-results/redgreen-shard-${shard}/redgreen-shard-${shard}-summary.txt" | grep -oP '\d+' || echo "0")
            skip=$(grep -oP '\d+ SKIP' "redgreen-results/redgreen-shard-${shard}/redgreen-shard-${shard}-summary.txt" | grep -oP '\d+' || echo "0")
            invalid=$(grep -oP '\d+ INVALID' "redgreen-results/redgreen-shard-${shard}/redgreen-shard-${shard}-summary.txt" | grep -oP '\d+' || echo "0")
            
            total_pass=$((total_pass + pass))
            total_fail=$((total_fail + fail))
            total_skip=$((total_skip + skip))
            total_invalid=$((total_invalid + invalid))
          fi
        done
        
        echo "## Total Across All Shards" >> docs/REDGREEN-STATUS.md
        echo "- PASS: ${total_pass}" >> docs/REDGREEN-STATUS.md
        echo "- FAIL: ${total_fail}" >> docs/REDGREEN-STATUS.md
        echo "- SKIP: ${total_skip}" >> docs/REDGREEN-STATUS.md
        echo "- INVALID: ${total_invalid}" >> docs/REDGREEN-STATUS.md
        
        cat docs/REDGREEN-STATUS.md
    
    - name: Upload summary artifact
      uses: actions/upload-artifact@v4
      with:
        name: redgreen-summary
        path: docs/REDGREEN-STATUS.md
