name: Tests

on:
  push:
    branches: [ main, cursor/** ]
  pull_request:
    branches: [ main ]

# Prevent duplicate runs: for PRs, cancel in-progress runs on new push
# Uses PR number for pull_request events, branch name for push events
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-python:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install ruff
      run: pip install ruff

    - name: Run ruff (check for duplicate definitions - F811)
      run: ruff check --select F811 .

  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Cache apt packages
      uses: actions/cache@v4
      with:
        path: /var/cache/apt/archives
        key: ${{ runner.os }}-apt-ffmpeg-${{ hashFiles('.github/workflows/test.yml') }}
    
    - name: Install system dependencies
      run: |
        # Retry apt operations to prevent 15+ minute install failures
        for i in 1 2 3; do
          sudo apt-get update && break || sleep 5
        done
        for i in 1 2 3; do
          sudo apt-get install -y ffmpeg && break || sleep 5
        done

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests
      timeout-minutes: 15
      env:
        REQUIRE_FFMPEG: "1"
      run: |
        pytest tests/ -v --tb=short --timeout=30 --durations=30 --junitxml=test-results/junit.xml

    # Report from the main run's JUnit XML (no second pytest run).
    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-junit
        path: test-results/junit.xml
        if-no-files-found: warn

  test-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      working-directory: web
      run: npm ci

    - name: Lint
      working-directory: web
      run: npm run lint

    - name: Unit tests (limits formatter, session token verifier)
      working-directory: web
      run: npm run test:unit

    - name: Build
      working-directory: web
      run: npm run build

  e2e:
    # ONE full dry-run episode through the studio UI against the REAL backend (no route mocks):
    # scripts/e2e_backend.py = Temporal dev server + production worker + FastAPI app in DRY_RUN.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('web/package-lock.json') }}

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Install web dependencies + Playwright Chromium
      working-directory: web
      run: |
        npm ci
        if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
          npx playwright install-deps chromium   # browsers restored from cache; OS libs only
        else
          npx playwright install --with-deps chromium
        fi

    - name: Build Next.js (production build, the E2E runs `next start`)
      working-directory: web
      run: npm run build

    - name: Run the dry-run episode E2E
      working-directory: web
      timeout-minutes: 12
      env:
        CI: "true"
        E2E_PYTHON: python
        E2E_ADMIN_SECRET: ci-e2e-admin-secret-only-for-this-job-000
      run: npx playwright test -c playwright.e2e.config.ts

    - name: Upload Playwright trace + report on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-e2e-trace
        path: |
          web/test-results-e2e/
          web/playwright-report/
        if-no-files-found: warn
        retention-days: 7

  redgreen:
    # G-CI-1: every probe/mutation declared in scripts/redgreen.sh gets an ordinal; shard N runs
    # the ordinals with ordinal % 4 == N-1 and writes one result row per id. redgreen-summary
    # checks that the union of the shards ran every declared id exactly once.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Cache apt packages
      uses: actions/cache@v4
      with:
        path: /var/cache/apt/archives
        key: ${{ runner.os }}-apt-ffmpeg-${{ hashFiles('.github/workflows/test.yml') }}
    
    - name: Install system dependencies
      run: |
        # Retry apt operations to prevent 15+ minute install failures
        for i in 1 2 3; do
          sudo apt-get update && break || sleep 5
        done
        for i in 1 2 3; do
          sudo apt-get install -y ffmpeg && break || sleep 5
        done

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run red-green mutation tests (shard ${{ matrix.shard }}/4)
      env:
        REQUIRE_FFMPEG: "1"
        REDGREEN_SHARD: ${{ matrix.shard }}
        REDGREEN_TOTAL_SHARDS: "4"
        REDGREEN_RESULTS_FILE: ${{ runner.temp }}/redgreen-results-shard-${{ matrix.shard }}-of-4.tsv
      run: |
        find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
        rm -rf .pytest_cache 2>/dev/null || true
        bash scripts/redgreen.sh

    - name: Upload shard results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: redgreen-results-shard-${{ matrix.shard }}
        path: ${{ runner.temp }}/redgreen-results-shard-${{ matrix.shard }}-of-4.tsv
        if-no-files-found: error

  redgreen-summary:
    # The red-green status is this job's artifact + step summary; no numbers are committed.
    runs-on: ubuntu-latest
    needs: redgreen
    if: always()
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Download all shard results
      uses: actions/download-artifact@v4
      with:
        pattern: redgreen-results-shard-*
        path: redgreen-results
        merge-multiple: true

    - name: Check the shard union covers every declared probe/mutation
      env:
        EXPECTED_SHA: ${{ github.sha }}
      run: |
        shopt -s nullglob
        files=(redgreen-results/*.tsv)
        status=0
        python scripts/redgreen_coverage.py --markdown redgreen-status.md \
          --expect-commit "$EXPECTED_SHA" --expect-shards 4 "${files[@]:-/nonexistent}" || status=$?
        cat redgreen-status.md >> "$GITHUB_STEP_SUMMARY" || true
        exit $status

    - name: Upload red-green status
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: redgreen-status
        path: |
          redgreen-status.md
          redgreen-results/
        if-no-files-found: warn

    - name: Fail if any shard failed
      if: needs.redgreen.result != 'success'
      env:
        RESULT: ${{ needs.redgreen.result }}
      run: |
        echo "redgreen shards result: $RESULT"
        exit 1
