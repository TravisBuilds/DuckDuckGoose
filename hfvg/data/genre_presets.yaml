# Genre presets registry for DuckDuckGoose video harness
# Version 0.1 - 24 archetype cards organized into 7 template groups
# All content is original or uses public-domain references only (no named IP)

schema_version: "0.1"

# Template definitions: shared defaults for each format family
templates:
  mood_loop:
    description: "1-3 shots, slow dolly/parallax, seamless loop, music only"
    length_s: [10, 90]
    pacing:
      cuts_per_10s: 0.3
      transitions: [cut, dissolve]
    vo_mode: none
    music_mode: required
    video_prompt_mode: loop
    story_structure: loop
    stage_overrides:
      plan: "1-3 shot cards, seamless loop prompt"
      stills: "1 hero still with upscale for wallpaper quality"
      video: "prompt_mode=loop, first/last frame match required"
      assembly: "loop seam check, optional text card overlay"

  music_montage:
    description: "8-30 cinematic shots cut to music, little or no dialogue, title/end card"
    length_s: [30, 180]
    pacing:
      cuts_per_10s: 3.0
      transitions: [cut, dissolve]
    vo_mode: caption_only
    music_mode: required
    video_prompt_mode: cut
    story_structure: montage
    stage_overrides:
      plan: "beats on music bar grid; pick music style first"
      audio: "music before cut timing, optional narration overlay"
      assembly: "title/end card rendering"

  dialogue_episode:
    description: "Character sitcom/series with shot-reverse-shot coverage and subtitles"
    length_s: [30, 180]
    pacing:
      cuts_per_10s: 3.0
      transitions: [cut]
    vo_mode: dialogue
    music_mode: optional
    video_prompt_mode: cut
    story_structure: episode_cliffhanger
    stage_overrides:
      plan: "script with speaker-tagged lines, shot-reverse-shot coverage"
      audio: "voice lock per character with speaker mapping"
      assembly: "burned subtitles, optional series bug"

  continuous_pov:
    description: "One continuous camera path (FPV/selfie/orbit), clips chained last->first frame"
    length_s: [20, 60]
    pacing:
      cuts_per_10s: 0.5
      transitions: [cut, dissolve]
    vo_mode: none
    music_mode: optional
    video_prompt_mode: continuous
    story_structure: continuous_journey
    stage_overrides:
      plan: "camera path description, not cut list; continuity notes"
      video: "prompt_mode=continuous, chain last->first frame with end_frame refs"
      assembly: "seam QC check for continuity breaks"

  cozy_micro:
    description: "10-20s cute moments with macro/insert shots and strong style lock"
    length_s: [10, 20]
    pacing:
      cuts_per_10s: 3.0
      transitions: [cut, whip_blur]
    vo_mode: caption_only
    music_mode: required
    video_prompt_mode: cut
    story_structure: micro_arc
    stage_overrides:
      stills: "style lock mandatory, macro insert library"
      audio: "ASMR SFX emphasis with soft music bed"

  action_sequence:
    description: "Choreographed fight/chase with fast cuts or one-take whips, heavy SFX"
    length_s: [20, 60]
    pacing:
      cuts_per_10s: 5.0
      transitions: [cut, whip_pan]
    vo_mode: none
    music_mode: required
    video_prompt_mode: cut
    story_structure: escalation
    stage_overrides:
      plan: "choreography beats with set-piece escalation"
      audio: "SFX-heavy with score bed"
    gates_add: [moderation_precheck, manual_review]

  gag_short:
    description: "Single premise -> escalation -> punchline/caption card, 10-30s"
    length_s: [10, 30]
    pacing:
      cuts_per_10s: 1.5
      transitions: [cut]
    vo_mode: caption_only
    music_mode: required
    video_prompt_mode: cut
    story_structure: escalation_punchline
    stage_overrides:
      plan: "premise -> escalation -> punchline structure"
      assembly: "caption/punchline card, AI disclosure label"

# Common defaults inherited by all presets (gates are additive)
defaults:
  gates: [brief_safety, beatmap_approval, stills_strip, stills_safety, final_approval]
  ip_mode: original_only
  video:
    retry_max_per_shot: 1
    model_routing: auto
  budget:
    cap_source: user_request
    stop_at_pct: 80

# All 24 presets (original content, no named IP)
presets:
  - id: nostalgia-time-travel
    name: "Back to the 2000s"
    description: "A family memory brought back in period detail"
    template: dialogue_episode
    aspect: "9:16"
    length_s: [25, 40]
    default_length_s: 30
    pacing:
      cuts_per_10s: 3.2
    shot_grammar: ["handheld eye-level mediums", "OTS dialogue coverage", "period interiors", "warm film grade"]
    brief_fields: ["era", "place", "cast_roles", "memory_moment"]
    vo_mode: dialogue
    music: "soft nostalgic"
    identity_locks: [character, setting, style]
    risk_flags: [trademark, synthetic_human]
    stage_overrides:
      stills: "scrub recognizable brand logos from period settings"

  - id: satire-sketch
