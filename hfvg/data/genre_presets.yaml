    brief_fields: ["issue", "stand_in_characters", "gag", "punchline"]
    vo_mode: none
    music: "orchestral pomp"
    identity_locks: [character, setting]
    risk_flags: [political, real_likeness]
    stage_overrides:
      stills: "real-person likeness HARD BLOCK - use caricature or invented figures only"
      assembly: "AI satire disclosure label"
    gates_add: [manual_review]

