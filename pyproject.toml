[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hands-free-video-generator"
version = "0.1.0"
description = "Temporal-based workflow harness for turning ideas into finished short videos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "temporalio>=1.8.0",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.20.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "structlog>=24.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
    "higgsfield-client>=0.2.0",
    "elevenlabs>=2.70.0",
]

[tool.hatch.build.targets.wheel]
packages = ["hfvg"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.2.0",
    "pytest-socket>=0.7.0",
    "respx>=0.21.0",
    "fastapi>=0.100.0",
    "python-multipart>=0.0.6",
]

[project.scripts]
hfvg = "hfvg.cli:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 30

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
