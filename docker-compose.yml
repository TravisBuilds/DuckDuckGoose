# DuckDuckGoose hosted stack. Secrets come from .env (mode 600).
# DRY_RUN must stay true unless someone explicitly enables live mode later.
services:
  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.28.1
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgresql
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file: .env
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_HOST: temporal:7233
      DRY_RUN: "${DRY_RUN:-true}"
      DATABASE_PATH: /data/studio.db
      DATA_DIR: /data
      EPISODES_DIR: /data/episodes
    volumes:
      - ./data:/data
    depends_on:
      - temporal
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    working_dir: /app
    command: ["python", "-m", "hfvg.worker"]
    env_file: .env
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_HOST: temporal:7233
      DRY_RUN: "${DRY_RUN:-true}"
      DATABASE_PATH: /data/studio.db
      DATA_DIR: /data
      EPISODES_DIR: /data/episodes
    volumes:
      - ./data:/data
    depends_on:
      - temporal
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://161.35.227.250
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://161.35.227.250
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2.9-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  temporal-pg:
